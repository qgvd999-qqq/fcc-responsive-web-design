<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Event Hub</title>
</head>
<body>
  <header>
    <h1>Event Hub</h1>
    <nav>
      <ul>
        <li><a href="#upcoming-events">Upcoming Events</a></li>
        <li><a href="#past-events">Past Events</a></li>
      </ul>
    </nav>
  </header>


  <main>
    <section id="upcoming-events">
      <h2>Upcoming Events</h2>
      <article>
        <h3>Event Title</h3>
        <p>Event Description</p>
      </article>
      <article>
        <h3>Event Title</h3>
        <p>Event Description <time datetime="20:00">20:00</time></p>
      </article>
    </section>

    <section id="past-events">
      <h2>Past Events</h2>
      <article>
        <h3>Event Title</h3>
        <p>Event Description <time datetime="20:00">20:00</time></p>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/past-event1.jpg" alt="Past Events">
      </article>
      <article>
        <h3>Event Title</h3>
        <p>Event Description <time datetime="20:00">20:00</time></p>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/past-event2.jpg" alt="Past Events">
      </article>
    </section>
  </main>
</body>
</html>
