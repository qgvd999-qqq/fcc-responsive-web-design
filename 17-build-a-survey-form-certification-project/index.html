<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>
  <body>
<h1 id="title">FCC Survey Form</h1>

<p id="description">Please Fill Out this Short Survey to help us improve</p>

  <form id="survey-form">
    <label><input type="checkbox" name="improve" value="front-end"> Front-end Projects</label>
<label><input type="checkbox" name="improve" value="back-end"> Back-end Projects</label>

    <label id="name-label" for="name">Name:</label>
    <input type="text" id="name" placeholder="Place your name" required>

    <label id="email-label" for=email>Email:</label>
    <input type="email" id="email" placeholder="Enter Your email" required>

    <label id="number-label" for="number">Age:</label>
    <input type="number" id="number" min="1" max="100" placeholder="Enter your age">
  
  <select id="dropdown">
  <option valve="student">Student</option>
  <option value="full-time">Full-time Job>/option>
    </select>
    <label><input type="radio" name="recommend" value="yes"> Yes</label>
    <label><input type="radio" name="recommend" value="no"> No</label>

      <label for="comments">Additional comments:</label>
  <textarea id="comments" name="comments" placeholder="Enter your comments here..."></textarea>

  <button type="submit" id="submit">Submit</button>

</form>

  </body>
</html>
